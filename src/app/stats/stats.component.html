@if (stats$ | async; as stats) {
  <div class="stats-container" [ngClass]="{mobile: mobile}">
    <span appAnalyticsEvent="Toggle bonuses" class="stats-entry" [ngClass]="{inactive: !statsControls.bonuses}"
      (click)="toggleCards('bonuses', $event)"
      matTooltip="{{statsControls.bonuses ? 'Filter out' : 'Count in'}} all bonuses">
      {{stats.bonusCards}}
      <picture>
        <img src="assets/cards/backgrounds/bonus-background.webp" alt="bonus cards">
      </picture>
    </span>
    <span appAnalyticsEvent="Toggle hummingbirds" class="stats-entry" [ngClass]="{inactive: !statsControls.hummingbirds}"
      (click)="toggleCards('hummingbirds', $event)"
      matTooltip="{{statsControls.hummingbirds ? 'Filter out' : 'Count in'}} all hummingbirds">
      {{stats.hummingbirdCards}}
      <picture>
        <img src="assets/icons/png/hummingbird.webp" alt="hummingbirds">
      </picture>
    </span>
    <span appAnalyticsEvent="Toggle birds" class="stats-entry" [ngClass]="{inactive: !statsControls.birds}"
      (click)="toggleCards('birds', $event)"
      matTooltip="{{statsControls.birds ? 'Filter out' : 'Count in'}} all birds">
      {{stats.birdCards}}
      <picture>
        <img src="assets/icons/png/bird.webp" alt="birds">
      </picture>
    </span>
    <div class="habitat-container" [ngClass]="{mobile: mobile}"
      matTooltip="Filter birds that can live in a specific habitat">
      <span appAnalyticsEvent="Toggle habitat" eventLabel="forest" class="stats-entry"
            [ngClass]="{
              inactive: statsControls.habitat.forest === 0,
              exclude: statsControls.habitat.forest === 2,
              ignore: !statsControls.birds
            }" (click)="toggleHabitat('forest', $event)">
        {{stats.habitat.forest}}
        <picture>
          <img src="assets/icons/png/forest.webp" alt="forest birds">
        </picture>
      </span>
      <span appAnalyticsEvent="Toggle habitat" eventLabel="grassland" class="stats-entry"
            [ngClass]="{
              inactive: statsControls.habitat.grassland === 0,
              exclude: statsControls.habitat.grassland === 2,
              ignore: !statsControls.birds
            }" (click)="toggleHabitat('grassland', $event)">
        {{stats.habitat.grassland}}
        <picture>
          <img src="assets/icons/png/grassland.webp" alt="grassland birds">
        </picture>
      </span>
      <span appAnalyticsEvent="Toggle habitat" eventLabel="wetland" class="stats-entry"
            [ngClass]="{
              inactive: statsControls.habitat.wetland === 0,
              exclude: statsControls.habitat.wetland === 2,
              ignore: !statsControls.birds
            }" (click)="toggleHabitat('wetland', $event)">
        {{stats.habitat.wetland}}
        <picture>
          <img src="assets/icons/png/wetland.webp" alt="wetland birds">
        </picture>
      </span>
    </div>
  </div>
}
