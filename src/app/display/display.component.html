<div class="card-grid" infiniteScroll [infiniteScrollDistance]="3" [infiniteScrollThrottle]="50"
  [infiniteScrollDisabled]="scrollDisabled$ | async" (scrolled)="onScroll()">
  @for (card of cards$ | async; track card) {
    <!-- A ruling is prose, so it spans the grid instead of taking a card-shaped tile. -->
    @if (isRulingCard(card)) {
      <div class="ruling-tile">
        <app-ruling-card [card]="card"></app-ruling-card>
      </div>
    } @else {
      <div class="card-tile">
        @if (isBirdCard(card)) {
          <mat-card appAnalyticsEvent="Bird detail" [eventLabel]="card['Common name']"
            class="fill-parent" routerLink="/card/{{card.id}}">
            <app-bird-card [card]="card"></app-bird-card>
          </mat-card>
        }
        @if (isHummingbirdCard(card)) {
          <mat-card appAnalyticsEvent="Hummingbird detail" [eventLabel]="card['Common name']"
            class="fill-parent" routerLink="/card/{{card.id}}">
            <app-hummingbird-card [card]="card"></app-hummingbird-card>
          </mat-card>
        }
        @if (isBonusCard(card)) {
          <mat-card appAnalyticsEvent="Bonus detail" [eventLabel]="card.CardType"
            class="fill-parent" routerLink="/card/{{card.id}}">
            <app-bonus-card [card]="card"></app-bonus-card>
          </mat-card>
        }
      </div>
    }
  }
</div>
